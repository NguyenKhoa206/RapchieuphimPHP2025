<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .revenue-container {
            background: white;
            padding: 20px;
            margin: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h3>Danh sách phim</h3>
        <ul>
            <li><a href="/admin/bophim.html">Bộ phim</a></li>
            <li><a href="/admin/diadiem.html">Địa điểm rạp</a></li>
        </ul>
        <h3>Doanh thu</h3>
        <ul>
            <li><a href="/admin/doanhthunam.html">Năm</a></li>
            <li><a href="/admin/doanhthuthang.html">Tháng</a></li>
            <li><a href="/admin/doanhthungay.html">Ngày</a></li>
        </ul>
        <h3>User</h3>
        <ul>
            <li><a href="/admin/user.html">Danh sách user</a></li>
        </ul>
        <div class="logout">Đăng xuất</div>
    </div>

    <div class="main" id="main">
        <div class="topbar">
            <button class="toggle-btn" id="toggleBtn">☰</button>
            <div class="welcome">Admin</div>
        </div>
        <div class="content">
            <!-- Nội dung chính hiển thị ở đây -->

            <div class="revenue-container">
                <h2>Doanh thu theo năm</h2>
                <canvas id="revenueChart" width="800" height="400"></canvas>
            </div>
        </div>
    </div>

    <script src="/admin/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded",()=>{
        const ctx=document.getElementById('revenueChart');

    const years=['2023','2024','2025'];
    const revenues=[120,180,240];

    new Chart(ctx, {
        type:'bar',
        data: {
            labels:years,
            datasets: [{
                label: 'Doanh thu (triệu đồng)',
                data: revenues,
                fill: true,
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderColor: 'rgba(75, 192, 192, 1)',
                tension: 0.3,
                borderWidth: 2,
                pointRadius: 4,
                pointBackgroundColor: 'rgba(75, 192, 192, 1)'
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{display: true},
                title:{
                    display: true,
                    text: 'Biểu đồ doanh thu theo năm'
                }
            },
            scales:{
                y:{
                    beginAtZero:true,
                    title:{display:true,text:'Triệu đồng'}
                },
                x: {
                    title: {display:true,text:'Năm'}
                }
            }
        }
    });
});
    </script>
</body>
</html>
