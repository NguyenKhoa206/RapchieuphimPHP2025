<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ phim</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .movie-container{
            max-width: 1000px;
            margin:auto;
            background: white;
            padding: 30px;
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            color:#222;
        }

        .tab-buttons{
            display:flex;
            justify-content: center;
            gap:20px;
            margin-bottom: 25px;
        }

        .tab-btn{
            padding:10px 20px;
            border: none;
            background-color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .tab-btn.active{
            background-color: #007bff;
            color: white;
            transform: scale(1.05);
        }

        .tab-btn:hover{
            background-color: #007bff;
            color:white;
        }

        .tab-pane{
            display:none;
        }

        .tab-pane.active{
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .movie-grid{
            display:flex;
            flex-wrap: wrap;
            justify-content: center;
            gap:25px;
        }

        .movie-card{
            width:200px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align:center;
            padding-bottom: 10px;
            transition: 0.3s;
        }

        .movie-card:hover{
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
        }
        
        .movie-card h4{
            margin: 10px 0 5px;
            color: #333;
        }

        .movie-card p{
            font-size: 14px;
            color:#555;
        }

        .open-modal-btn {
        padding:10px 20px;
        border:none;
        background:#007bff;
        color:white;
        border-radius:5px;
        cursor:pointer;
        font-weight: bold;
        transition:0.3s;
        }
        .open-modal-btn:hover {
        background:#0056b3;
        }

        .modal {
            display: none;
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content input, .modal-content button {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .close-btn {
            background: #6c757d;
            color: white;
            border: none;
            cursor: pointer;
        }

        .close-btn:hover {
            background: red;
        }
        
        select {
            padding: 8px;
            border-radius: 5px;
            border:1px solid #ccc;
        }

        .add-btn {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            transition:0.3s;
        }
        .add-btn:hover {
            background:#218838;
        }

        .delete-movie-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .delete-movie-btn:hover {
            background: #c82333;
        }

        @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h3>Danh sách phim</h3>
        <ul>
            <li><a href="/admin/bophim.html">Bộ phim</a></li>
            <li><a href="/admin/diadiem.html">Địa điểm rạp</a></li>
        </ul>
        <h3>Doanh thu</h3>
        <ul>
            <li><a href="/admin/doanhthunam.html">Năm</a></li>
            <li><a href="/admin/doanhthuthang.html">Tháng</a></li>
            <li><a href="/admin/doanhthungay.html">Ngày</a></li>
        </ul>
        <h3>User</h3>
        <ul>
            <li><a href="/admin/user.html">Danh sách user</a></li>
        </ul>
        <div class="logout">Đăng xuất</div>
    </div>

    <div class="main" id="main">
        <div class="topbar">
            <button class="toggle-btn" id="toggleBtn">☰</button>
            <div class="welcome">Admin</div>
        </div>
        <div class="content">
            <!-- Nội dung chính hiển thị ở đây -->

        <div class="movie-container">
        <h2>Bộ phim</h2>
            
        <div class="tab-buttons">
            <button class="tab-btn active" data-target="dang-chieu">🎬 Phim đang chiếu</button>
            <button class="tab-btn" data-target="sap-chieu">⏳ Phim sắp chiếu</button>
        </div>

        <div class="tab-content">
            <div class="tab-pane active" id="dang-chieu">
                <div class="movie-grid">
                    <div class="movie-card">
                        <img src="/hinh/avatar-3-500_1753848148849.jpg" alt="hinh a">
                        <h4>Avatar</h4>
                        <p>Thể loại</p>
                        <button class="delete-movie-btn">Xóa</button>
                    </div>
                    <div class="movie-card">
                        <img src="/hinh/jujutsu-kaisen-500_1759216418459.jpg" alt="hinh b">
                        <h4>jujutsu</h4>
                        <p>Thể loại</p>
                        <button class="delete-movie-btn">Xóa</button>
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="sap-chieu">
                <div class="movie-grid">
                    <div class="movie-card">
                        <img src="/hinh/shinchan-500_1754281110224.jpg" alt="hinh c">
                        <h4>Shin</h4>
                        <p>thể loại</p>
                        <button class="delete-movie-btn">Xóa</button>
                    </div>
                </div>
            </div>
        </div>
        <div style="display:flex; justify-content:flex-end; margin-top:15px;">
            <button id="openModalBtn" class="open-modal-btn fixed-btn">Thêm phim</button>
        </div>
        <div class="modal" id="movieModal">
            <div class="modal-content">
                <input type="text" placeholder="Tên phim">
                <input type="text" placeholder="Thể loại">
                <input type="text" placeholder="URL hình ảnh">
                <select id="movie-status">
                    <option value="dang-chieu">Phim đang chiếu</option>
                    <option value="sap-chieu">Phim sắp chiếu</option>
                </select>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button class="add-btn" id="addMovieBtn">Thêm</button>
                    <button class="close-btn" id="closeModalBtn">Đóng</button>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>

    <script src="/admin/script.js"></script>
    <script src="/admin/bophim.js"></script>
</body>
</html>
