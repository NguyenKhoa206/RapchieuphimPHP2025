<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Địa điểm rạp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .rap-container{
            max-width: 1500px;
            margin:auto;
            background-color: white;
            padding:20px;
            border-radius: 10px;
        }

        .rap-list{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rap-card{
            background: white;
            padding:15px;

            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .rap-card h4{
            margin-bottom: 5px;
        }

        .rap-card p{
            font-size: 14px;
            margin-bottom: 10px;
        }

        .delete-rap-btn{
            background: red;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor:pointer;
        }
        
        .delete-rap-btn:hover{
            background: #c82333;
        }

                .open-modal-btn {
        padding:10px 20px;
        border:none;
        background:#007bff;
        color:white;
        border-radius:5px;
        cursor:pointer;
        font-weight: bold;
        transition:0.3s;
        }
        .open-modal-btn:hover {
        background:#0056b3;
        }

        .modal {
            display: none;
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content input, .modal-content button {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .close-btn {
            background: #6c757d;
            color: white;
            border: none;
            cursor: pointer;
        }

        .close-btn:hover {
            background: red;
        }
        
        select {
            padding: 8px;
            border-radius: 5px;
            border:1px solid #ccc;
        }

        .add-btn {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            transition:0.3s;
        }
        .add-btn:hover {
            background:#218838;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h3>Danh sách phim</h3>
        <ul>
            <li><a href="/admin/bophim.html">Bộ phim</a></li>
            <li><a href="/admin/diadiem.html">Địa điểm rạp</a></li>
        </ul>
        <h3>Doanh thu</h3>
        <ul>
            <li><a href="/admin/doanhthunam.html">Năm</a></li>
            <li><a href="/admin/doanhthuthang.html">Tháng</a></li>
            <li><a href="/admin/doanhthungay.html">Ngày</a></li>
        </ul>
        <h3>User</h3>
        <ul>
            <li><a href="/admin/user.html">Danh sách user</a></li>
        </ul>
        <div class="logout">Đăng xuất</div>
    </div>

    <div class="main" id="main">
        <div class="topbar">
            <button class="toggle-btn" id="toggleBtn">☰</button>
            <div class="welcome">Admin</div>
        </div>
        <div class="content">
            <!-- Nội dung chính hiển thị ở đây -->
            <div class="rap-container">
                <h2>Danh sách rạp</h2>
                <div class="rap-list">
                    <div class="rap-card">
                        <h4>Rạp</h4>
                        <p>Địa chỉ:</p>
                        <button class="delete-rap-btn">Xóa</button>
                    </div>
                    <div class="rap-card">
                        <h4>Rạp</h4>
                        <p>Địa chỉ:</p>
                        <button class="delete-rap-btn">Xóa</button>
                    </div>
                </div>
            </div>
            <div style="display:flex; justify-content: flex-end; margin-top: 15px;">
                <button id="openRapModalBtn" class="open-modal-btn">Thêm rạp</button>
            </div>
            <div class="modal" id="rapModal">
                <div class="modal-content">
                    <input type="text" id="rap-name" placeholder="Tên rạp">
                    <input type="text" id="rap-address" placeholder="Địa chỉ rạp">
                    <div style="display:flex; justify-content: flex-end; gap:10px;">
                        <button class="add-btn" id="addRapBtn">Thêm</button>
                        <button class="close-btn" id="closeRapModalBtn">Đóng</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/script.js"></script>
    <script src="/admin/diadiem.js"></script>
</body>
</html>
