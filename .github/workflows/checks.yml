name: PHP checks

on:
  push:
    branches: [main, update]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: test-only-password
      DB_NAME: cinema_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install PHP 8.3 extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-mysql php8.3-mbstring
      - name: Check syntax
        run: |
          find app config public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          node --check public/assets/js/app.js
      - name: Run business and concurrency checks
        run: |
          php scripts/install.php
          php tests/run.php
          php tests/payments.php
          php tests/payment-concurrency.php
          php tests/history.php
          php tests/concurrency.php
      - name: Check legacy migration
        env:
          DB_NAME: cinema_migration_test
        run: |
          php scripts/install.php
          php tests/migration.php
      - name: Check HTTP flows
        env:
          DB_NAME: cinema_http_test
          VNPAY_ENABLED: "1"
          VNPAY_ENVIRONMENT: sandbox
          VNPAY_TMN_CODE: TEST1234
          VNPAY_HASH_SECRET: test-only-vnpay-signing-secret
          VNPAY_RETURN_URL: https://cinema.example/payment/return.php
        run: |
          php scripts/install.php
          php scripts/seed.php
          php -S 127.0.0.1:8000 -t public > /tmp/cinema-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 0.2
          done
          php tests/http.php
      - name: Install browser checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check desktop/mobile UI and accessibility
        env:
          DB_NAME: cinema_ui_test
          VNPAY_ENABLED: "1"
          VNPAY_ENVIRONMENT: sandbox
          VNPAY_TMN_CODE: TEST1234
          VNPAY_HASH_SECRET: test-only-vnpay-signing-secret
          VNPAY_RETURN_URL: https://cinema.example/payment/return.php
        run: |
          php scripts/install.php
          php scripts/seed.php
          php tests/ui-fixture.php
          php -S 127.0.0.1:8000 -t public > /tmp/cinema-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 0.2
          done
          npm run test:ui
      - name: Save UI screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinema-ui-checks
          path: test-results/
          retention-days: 7
